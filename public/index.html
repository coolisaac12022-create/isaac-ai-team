<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Isaac AI Team</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Isaac AI Team</h1>
        <p>Tableau de bord de gestion de projet assisté par IA</p>
        <small>Version: 7729fb8</small>
      </header>

      <section class="panel">
        <h2>État du service</h2>
        <button id="healthBtn">Vérifier le serveur</button>
        <pre id="healthOutput">Cliquez pour vérifier.</pre>
      </section>

      <section class="panel">
        <h2>Assistant IA</h2>
        <label>
          <input id="voiceEnabled" type="checkbox" checked /> Lire les réponses à voix haute
        </label>
        <form id="chatForm">
          <textarea id="prompt" rows="4" placeholder="Posez une question à l’assistant..."></textarea>
          <button type="submit">Envoyer</button>
        </form>
        <pre id="chatOutput">Réponse de l’IA apparaîtra ici.</pre>
      </section>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      }

      const healthBtn = document.getElementById('healthBtn');
      const healthOutput = document.getElementById('healthOutput');
      const chatForm = document.getElementById('chatForm');
      const chatOutput = document.getElementById('chatOutput');
      const voiceEnabled = document.getElementById('voiceEnabled');

      function speakReply(reply) {
        if (!voiceEnabled.checked || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanAssistantText(reply));
        utterance.lang = 'fr-FR';
        window.speechSynthesis.speak(utterance);
      }

      function cleanAssistantText(text) {
        return String(text || '')
          .replace(/```[\s\S]*?```/g, '')
          .replace(/[*_~`#]+/g, '')
          .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/^\s*[-+]\s+/gm, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function buildHeaders() {
        return {
          'Content-Type': 'application/json'
        };
      }

      async function readJsonResponse(response) {
        const contentType = response.headers.get('content-type') || '';
        const body = await response.text();
        try {
          return JSON.parse(body);
        } catch {
          if (!contentType.includes('application/json')) {
            throw new Error(`Le serveur a renvoyÃ© ${response.status} ${response.statusText || ''} au lieu de JSON pour ${response.url}.`);
          }
          throw new Error(`Réponse JSON invalide reçue de ${response.url}.`);
        }
      }

      healthBtn.addEventListener('click', async () => {
        try {
          const response = await fetch('/api/health');
          const data = await readJsonResponse(response);
          healthOutput.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          healthOutput.textContent = 'Erreur: ' + error.message;
        }
      });

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const prompt = document.getElementById('prompt').value.trim();

        if (!prompt) {
          chatOutput.textContent = 'Veuillez saisir une question.';
          return;
        }

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify({ agent: 'directeur', message: prompt })
          });

          const data = await readJsonResponse(response);
          chatOutput.textContent = response.ok
            ? cleanAssistantText(data.reply)
            : JSON.stringify(data, null, 2);
          if (response.ok) speakReply(data.reply);
        } catch (error) {
          chatOutput.textContent = 'Erreur: ' + error.message;
        }
      });
    </script>
  </body>
</html>
