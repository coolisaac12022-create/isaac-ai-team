<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Isaac AI Team</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Isaac AI Team</h1>
        <p>Tableau de bord de gestion de projet assisté par IA</p>
        <small>Version: 7729fb8</small>
      </header>

      <section class="panel">
        <h2>État du service</h2>
        <button id="healthBtn">Vérifier le serveur</button>
        <pre id="healthOutput">Cliquez pour vérifier.</pre>
      </section>

      <section class="panel">
        <h2>Assistant IA</h2>
        <label for="appPassword">Mot de passe</label>
        <input id="appPassword" type="password" placeholder="Entrez le mot de passe" autocomplete="current-password" />
        <label>
          <input id="voiceEnabled" type="checkbox" checked /> Lire les réponses à voix haute
        </label>
        <form id="chatForm">
          <textarea id="prompt" rows="4" placeholder="Posez une question à l’assistant..."></textarea>
          <button type="submit">Envoyer</button>
        </form>
        <pre id="chatOutput">Réponse de l’IA apparaîtra ici.</pre>
      </section>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      }

      const healthBtn = document.getElementById('healthBtn');
      const healthOutput = document.getElementById('healthOutput');
      const chatForm = document.getElementById('chatForm');
      const chatOutput = document.getElementById('chatOutput');
      const appPassword = document.getElementById('appPassword');
      const voiceEnabled = document.getElementById('voiceEnabled');
      const STORAGE_KEY = 'isaac-ai-team-password';

      function speakReply(reply) {
        if (!voiceEnabled.checked || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(reply);
        utterance.lang = 'fr-FR';
        window.speechSynthesis.speak(utterance);
      }

      function getPassword() {
        return localStorage.getItem(STORAGE_KEY) || '';
      }

      function buildHeaders() {
        const password = getPassword();
        return {
          'Content-Type': 'application/json',
          ...(password ? { 'X-App-Password': password } : {})
        };
      }

      async function readJsonResponse(response) {
        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          await response.text();
          throw new Error(`Le serveur a renvoyé ${response.status} ${response.statusText} au lieu de JSON pour ${response.url}.`);
        }
        return response.json();
      }

      async function ensureAccess() {
        const statusResponse = await fetch('/api/auth/status');
        const status = await readJsonResponse(statusResponse);

        if (!status.passwordProtected) {
          return;
        }

        let password = appPassword.value.trim() || getPassword();

        if (!password) {
          throw new Error('Veuillez saisir le mot de passe.');
        }

        const loginResponse = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const loginData = await readJsonResponse(loginResponse);

        if (!loginResponse.ok) {
          localStorage.removeItem(STORAGE_KEY);
          throw new Error(loginData.error || 'Mot de passe incorrect.');
        }

        localStorage.setItem(STORAGE_KEY, password);
        appPassword.value = password;
      }

      healthBtn.addEventListener('click', async () => {
        try {
          const response = await fetch('/api/health');
          const data = await readJsonResponse(response);
          healthOutput.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          healthOutput.textContent = 'Erreur: ' + error.message;
        }
      });

      chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const prompt = document.getElementById('prompt').value.trim();

        if (!prompt) {
          chatOutput.textContent = 'Veuillez saisir une question.';
          return;
        }

        try {
          await ensureAccess();
          const password = appPassword.value.trim() || getPassword();
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify({ agent: 'directeur', message: prompt, password })
          });

          const data = await readJsonResponse(response);
          chatOutput.textContent = response.ok
            ? data.reply
            : JSON.stringify(data, null, 2);
          if (response.ok) speakReply(data.reply);
        } catch (error) {
          chatOutput.textContent = 'Erreur: ' + error.message;
        }
      });
    </script>
  </body>
</html>
